		<script src="https://cdn.jsdelivr.net/npm/typescript@5.3.3/lib/typescript.js"></script>
		<script type="module">
			const response = await fetch("./scripts/MapScript.ts");

			if (!response.ok) {
				throw new Error(
					`MapScript.ts konnte nicht geladen werden: ${response.status}`,
				);
			}

			const source = await response.text();

			const { outputText } = ts.transpileModule(source, {
				compilerOptions: {
					target: ts.ScriptTarget.ES2020,
					module: ts.ModuleKind.ES2020,
				},
			});

			const script = document.createElement("script");
			script.type = "module";
			script.textContent = outputText;
			document.body.appendChild(script);
